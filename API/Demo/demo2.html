<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豌豆测试工具 - 一键导单 & 加入直播课</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.8.4/dist/index.full.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.8.4/dist/index.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 0; background: #f0f2f5; }
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .header { text-align: center; margin-bottom: 30px; color: #409EFF; }
    .el-card { margin-bottom: 24px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .result-box { margin-top: 20px; background: #f5f7fa; padding: 16px; border-radius: 8px; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 14px; }
    .error { color: #f56c6c; }
    .success { color: #67c23a; }
    .tab-content { padding: 20px 0; }
    /* 自定义 Tab 选中样式 */
    .el-tabs__item.is-active {
      background-color: #409EFF !important;
      color: white !important;
      font-weight: bold !important;
      border-radius: 4px 4px 0 0;
    }
    .el-tabs__item.is-active:hover {
      background-color: #409EFF !important;
      color: white !important;
    }
    .el-tabs__item {
      transition: all 0.3s;
    }
    .el-tabs__item:hover {
      color: #409EFF;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="header">
        <h1>豌豆测试工具</h1>
        <p style="color: #909399;">一键导单 + 学生加入直播课</p>
      </div>

      <el-tabs v-model="activeTab" type="card">
        <el-tab-pane label="一键导单" name="order">
          <el-card>
            <template #header><span>订单导入配置</span></template>
            <el-form :model="orderForm" :rules="orderRules" ref="orderFormRef" label-width="140px">
              <el-form-item label="学科" prop="subjectIds">
                <el-checkbox-group v-model="orderForm.subjectIds">
                  <el-checkbox v-for="item in subjectOptions" :key="item.value" :label="item.value">
                    {{ item.label }}
                  </el-checkbox>
                </el-checkbox-group>
              </el-form-item>

              <el-form-item label="环境" prop="environment">
                <el-radio-group v-model="orderForm.environment">
                  <el-radio v-for="env in envOptions" :key="env.value" :label="env.value">
                    {{ env.label }}
                  </el-radio>
                </el-radio-group>
              </el-form-item>

              <el-form-item label="手机号来源">
                <el-switch v-model="useCustomNumber" active-text="自定义" inactive-text="系统生成" />
              </el-form-item>

              <el-form-item v-if="!useCustomNumber" label="生成数量" prop="num">
                <el-input-number v-model="orderForm.num" :min="1" :max="100" controls-position="right" />
                <span style="margin-left: 10px;">条（1-100）</span>
              </el-form-item>

              <el-form-item v-else label="自定义手机号" prop="customNumber">
                <el-input type="textarea" v-model="orderForm.customNumber" :rows="5"
                  placeholder="每行一个手机号，例如：&#10;13812345678&#10;13987654321" />
              </el-form-item>

              <el-form-item label="自定义套餐ID">
                <el-input v-model="orderForm.sku" placeholder="不填使用默认" />
              </el-form-item>

              <el-form-item label="自定义金额">
                <el-input v-model="orderForm.amt" placeholder="不填使用默认" />
              </el-form-item>

              <el-form-item label="自定义渠道ID">
                <el-input v-model="orderForm.channelId" placeholder="不填使用默认" />
              </el-form-item>

              <el-form-item label="手机区号">
                <el-input v-model="orderForm.code" placeholder="默认 86" />
              </el-form-item>

              <el-form-item>
                <el-button type="primary" @click="submitOrder" :loading="orderLoading">一键导单</el-button>
                <el-button @click="resetOrderForm">重置</el-button>
              </el-form-item>
            </el-form>
          </el-card>

          <el-card v-if="orderResult || orderError">
            <template #header><span>导单结果</span></template>
            <div v-if="orderError" class="error"><h3>失败</h3><p>{{ orderError }}</p></div>
            <div v-else-if="orderResult">
              <h3 class="success">导单成功！</h3>
              <div class="result-box"><pre>{{ JSON.stringify(orderResult, null, 2) }}</pre></div>
            </div>
          </el-card>
        </el-tab-pane>

        <el-tab-pane label="加入直播课" name="join">
          <el-card>
            <template #header><span>排课配置</span></template>
            <el-form :model="joinForm" :rules="joinRules" ref="joinFormRef" label-width="140px">
              <el-form-item label="学科" prop="subjectId">
                <el-select v-model="joinForm.subjectId" placeholder="请选择学科">
                  <el-option v-for="item in subjectOptions" :key="item.value" :label="item.label" :value="item.value" />
                </el-select>
              </el-form-item>

              <el-form-item label="环境" prop="environment">
                <el-radio-group v-model="joinForm.environment">
                  <el-radio v-for="env in joinEnvOptions" :key="env.value" :label="env.value">
                    {{ env.label }}
                  </el-radio>
                </el-radio-group>
              </el-form-item>

              <el-form-item label="课程类型">
                <el-radio-group v-model="joinForm.courseType">
                  <el-radio :label="1">小班直播课 (1)</el-radio>
                  <el-radio :label="11">大班直播课 (11)</el-radio>
                </el-radio-group>
              </el-form-item>

              <el-form-item label="学员ID列表" prop="userIds">
                <el-input type="textarea" v-model="joinForm.userIds" :rows="5"
                  placeholder="每行一个学员ID，例如：&#10;123456&#10;789012" />
              </el-form-item>

              <el-form-item label="指定老师ID">
                <el-input v-model="joinForm.teacherId" placeholder="不填使用默认老师（不自动排班）" />
                <div class="el-form-item__tip">填入后会自动为老师排班</div>
              </el-form-item>

              <el-form-item>
                <el-button type="primary" @click="submitJoin" :loading="joinLoading">一键加入</el-button>
                <el-button @click="resetJoinForm">重置</el-button>
              </el-form-item>
            </el-form>
          </el-card>

          <el-card v-if="joinResult || joinError">
            <template #header><span>排课结果</span></template>
            <div v-if="joinError" class="error"><h3>失败</h3><p>{{ joinError }}</p></div>
            <div v-else-if="joinResult">
              <h3 class="success">操作成功！</h3>
              <div class="result-box"><pre>{{ JSON.stringify(joinResult, null, 2) }}</pre></div>
            </div>
          </el-card>
        </el-tab-pane>
      </el-tabs>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;
    const app = createApp({
      setup() {
        const activeTab = ref('order');
        const subjectOptions = [
          { label: '表达', value: 1 },
          { label: '围棋', value: 2 },
          { label: '数学', value: 3 },
          { label: '魔力耳朵', value: 4 },
          { label: '魔力剑桥', value: 5 },
          { label: '益智', value: 6 }
        ];

        const envOptions = [
          { label: 'UAT', value: 'uat' },
          { label: '生产', value: 'prod' }
        ];

        const joinEnvOptions = [
          { label: 'UAT', value: 'uat' },
          { label: 'PreProd', value: 'preprod' }
        ];

        // 导单部分
        const orderFormRef = ref(null);
        const orderForm = ref({
          subjectIds: [],
          environment: 'uat',
          customNumber: '',
          num: 1,
          sku: '',
          amt: '',
          channelId: '',
          code: '86'
        });
        const useCustomNumber = ref(false);
        const orderLoading = ref(false);
        const orderResult = ref(null);
        const orderError = ref('');

        const orderRules = {
          subjectIds: [{ required: true, message: '请选择至少一个学科', trigger: 'change' }],
          environment: [{ required: true, message: '请选择环境', trigger: 'change' }],
          num: [
            { required: true, message: '请输入数量', trigger: 'blur' },
            { type: 'number', min: 1, max: 100, message: '数量范围 1-100', trigger: 'blur' }
          ]
        };

        const submitOrder = () => {
          orderFormRef.value.validate(async (valid) => {
            if (!valid) return;
            if (!orderForm.value.subjectIds.length) {
              ElMessage.error('请至少选择一个学科');
              return;
            }
            if (!useCustomNumber.value && (orderForm.value.num < 1 || orderForm.value.num > 100)) {
              ElMessage.error('生成数量必须在 1-100 之间');
              return;
            }

            orderLoading.value = true;
            orderResult.value = null;
            orderError.value = '';

            const payload = {
              subjectIds: orderForm.value.subjectIds,
              environment: orderForm.value.environment,
              num: useCustomNumber.value ? 1 : orderForm.value.num,
              customNumber: useCustomNumber.value
                ? orderForm.value.customNumber.trim().split('\n').map(s => s.trim()).filter(Boolean)
                : [],
              sku: orderForm.value.sku || undefined,
              amt: orderForm.value.amt || undefined,
              channelId: orderForm.value.channelId || undefined,
              code: orderForm.value.code || undefined
            };

            try {
              const res = await fetch('http://localhost:8000/order/import', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              const data = await res.json();
              if (res.ok && data.code === 0) {
                orderResult.value = data.data;
                ElMessage.success('导单成功！');
              } else {
                throw new Error(data.msg || '服务器返回错误');
              }
            } catch (err) {
              orderError.value = err.message || '请求失败';
              ElMessage.error(orderError.value);
            } finally {
              orderLoading.value = false;
            }
          });
        };

        const resetOrderForm = () => {
          orderFormRef.value.resetFields();
          useCustomNumber.value = false;
          orderResult.value = null;
          orderError.value = '';
        };

        // 加入直播课部分
        const joinFormRef = ref(null);
        const joinForm = ref({
          environment: 'uat',
          subjectId: null,
          userIds: '',
          teacherId: '',
          courseType: 1
        });
        const joinLoading = ref(false);
        const joinResult = ref(null);
        const joinError = ref('');

        const joinRules = {
          environment: [{ required: true, message: '请选择环境', trigger: 'change' }],
          subjectId: [{ required: true, message: '请选择学科', trigger: 'change' }],
          userIds: [{ required: true, message: '请输入学员ID', trigger: 'blur' }]
        };

        const submitJoin = () => {
          joinFormRef.value.validate(async (valid) => {
            if (!valid) return;

            const userIdsStr = joinForm.value.userIds.trim();
            if (!userIdsStr) {
              ElMessage.error('请至少输入一个学员ID');
              return;
            }

            const userIds = userIdsStr.split('\n')
              .map(id => id.trim())
              .filter(id => id && !isNaN(id) && Number(id) > 0)
              .map(Number);

            if (userIds.length === 0) {
              ElMessage.error('请输入有效的学员ID');
              return;
            }

            joinLoading.value = true;
            joinResult.value = null;
            joinError.value = '';

            const payload = {
              environment: joinForm.value.environment,
              subjectId: joinForm.value.subjectId,
              userIds: userIds,
              courseType: joinForm.value.courseType,
              teacherId: joinForm.value.teacherId ? Number(joinForm.value.teacherId) : undefined
            };

            try {
              const res = await fetch('http://localhost:8000/student_join_live', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              const data = await res.json();
              if (res.ok && data.code === 0) {
                joinResult.value = data.data;
                ElMessage.success('学员加入成功！');
              } else {
                throw new Error(data.msg || '服务器返回错误');
              }
            } catch (err) {
              joinError.value = err.message || '请求失败';
              ElMessage.error(joinError.value);
            } finally {
              joinLoading.value = false;
            }
          });
        };

        const resetJoinForm = () => {
          joinFormRef.value.resetFields();
          joinResult.value = null;
          joinError.value = '';
        };

        return {
          activeTab,
          subjectOptions,
          envOptions,
          joinEnvOptions,
          orderForm, orderFormRef, useCustomNumber, orderLoading, orderResult, orderError,
          orderRules, submitOrder, resetOrderForm,
          joinForm, joinFormRef, joinLoading, joinResult, joinError,
          joinRules, submitJoin, resetJoinForm
        };
      }
    });

    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
